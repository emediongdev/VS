<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f3026" />
  <title>Football Match Markets — UI Recreation</title>
  <style>
    :root {
      --green: #00efb1;
      --gold: #ffdf00;
      --header-deep: #0b2b23;
      --page: #111111;
      --card: #212121;
      --line: #353535;
      --text: #fff;
      --muted: #b5b5b5;
      --sidebar-width: 270px;
      --header-height: 71px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: var(--page); color: var(--text); font: 14px/1.35 Arial, Helvetica, sans-serif; overflow: hidden; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    .app { height: 100dvh; display: flex; flex-direction: column; min-height: 460px; }
    .site-header {
      height: var(--header-height); min-height: var(--header-height);
      display: flex; align-items: center;
      background: linear-gradient(105deg, #102d25 0%, #104635 48%, #0c241e 100%);
      position: relative; z-index: 20;
      padding-right: 20px;
    }
    .brand {
      width: var(--sidebar-width); min-width: var(--sidebar-width);
      padding-left: 19px; display: flex; align-items: center; height: 100%;
      white-space: nowrap; user-select: none;
      font-size: 29px; font-weight: 900; letter-spacing: -1.6px;
    }
    .brand .digits { color: var(--gold); }
    .top-links { display: flex; align-items: stretch; height: 100%; gap: 55px; margin-left: clamp(100px, 21vw, 286px); }
    .top-link {
      border: 0; border-bottom: 2px solid transparent; color: white; background: transparent;
      padding: 5px 0 0; font-size: 14px; font-weight: 700; white-space: nowrap;
    }
    .top-link.active { color: var(--green); border-bottom-color: var(--green); }
    .top-link:hover { color: var(--green); }
    .header-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .icon-button { display: inline-grid; place-items: center; border: none; background: none; color: #ddd; padding: 5px; }
    .icon-button svg { width: 21px; height: 21px; }
    .pill {
      min-height: 33px; padding: 6px 13px; background: transparent; color: white;
      border-radius: 20px; border: 1px solid #048a72; font-family: Georgia, 'Times New Roman', serif;
      font-size: 13px; font-weight: 700; white-space: nowrap;
    }
    .pill.yellow { border-color: var(--gold); color: var(--gold); }
    .pill:hover { background: #ffffff15; }
    .site-body { display: flex; min-height: 0; flex: 1; }
    aside {
      width: var(--sidebar-width); min-width: var(--sidebar-width); background: #111;
      overflow-y: auto; border-right: 1px solid #242424; padding: 19px 0 30px;
      scrollbar-color: #3b3b3b #111; scrollbar-width: thin;
    }
    aside::-webkit-scrollbar, main::-webkit-scrollbar { width: 8px; }
    aside::-webkit-scrollbar-track, main::-webkit-scrollbar-track { background: #111; }
    aside::-webkit-scrollbar-thumb, main::-webkit-scrollbar-thumb { background: #434343; border-radius: 8px; }
    .side-group { padding-top: 0; margin-bottom: 38px; }
    .side-heading { color: var(--green); font-size: 16px; font-weight: 700; margin: 14px 19px 9px; }
    .side-item {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      color: #fff; background: transparent; border: 0; min-height: 42px; padding: 6px 19px;
      font-size: 13px; font-weight: 700;
    }
    .side-item:hover, .side-item.selected { background: #1c2723; }
    .sport-emoji { display: inline-block; width: 21px; text-align: center; font-size: 19px; line-height: 1; flex-shrink: 0; }
    main { min-width: 0; flex: 1; overflow-y: auto; overflow-x: hidden; background: #111; scrollbar-color: #494949 #111; }
    .event-hero {
      height: 141px; position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse 57% 45% at 52% 112%, rgba(42, 94, 52, .8), transparent 88%),
        linear-gradient(180deg, transparent 40%, rgba(30, 66, 39, .72) 80%, rgba(14, 37, 23, .65) 100%),
        linear-gradient(90deg, #101111 0%, #171817 43%, #0c1712 100%);
    }
    .event-hero::before {
      content: ''; position: absolute; inset: 0; opacity: .27; pointer-events: none;
      background:
        radial-gradient(circle at 4% 24%, #b7b7a7 0 1px, transparent 3px),
        radial-gradient(circle at 13% 35%, #b7b7a7 0 1px, transparent 3px),
        radial-gradient(circle at 25% 39%, #b7b7a7 0 1px, transparent 3px),
        radial-gradient(circle at 32% 42%, #b7b7a7 0 1px, transparent 3px),
        radial-gradient(circle at 46% 29%, #b7b7a7 0 1px, transparent 3px),
        radial-gradient(circle at 60% 29%, #b7b7a7 0 1px, transparent 3px),
        radial-gradient(circle at 76% 25%, #b7b7a7 0 1px, transparent 3px),
        radial-gradient(circle at 89% 43%, #b7b7a7 0 1px, transparent 3px),
        repeating-linear-gradient(0deg, transparent, transparent 25px, rgba(0,0,0,.25) 26px, transparent 27px);
    }
    .event-hero::after { content: ''; position: absolute; left: 0; right: 0; top: 81px; height: 1px; background: #0d211936; }
    .back-button { position: absolute; z-index: 1; left: 28px; top: 9px; width: 32px; height: 32px; border: 1px solid #008a73; border-radius: 50%; color: var(--green); display: grid; place-items: center; background: #171c19; }
    .back-button svg { width: 20px; height: 20px; }
    .league { position: absolute; top: 16px; width: 100%; text-align: center; font-size: 12px; font-weight: 700; }
    .kickoff { position: absolute; top: 58px; width: 100%; text-align: center; font-size: 12px; font-weight: 700; }
    .versus { position: absolute; top: 84px; width: 100%; text-align: center; font-weight: 800; }
    .team { position: absolute; top: 46px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100px; font-size: 12px; font-weight: 700; }
    .team.home { left: calc(33.7% - 50px); }
    .team.away { right: calc(33.7% - 50px); }
    .shirt { display: block; width: 31px; height: 34px; filter: drop-shadow(0 1px 2px #0005); }
    .match-menu { position: absolute; bottom: 0px; left: calc(50% - 16px); background: #06181180; color: var(--green); border: 0; width: 32px; height: 32px; border-radius: 50% 50% 0 0; display: grid; place-items: center; }
    .match-menu svg { width: 17px; }
    .market-nav { height: 51px; border-bottom: 2px solid #187f69; display: flex; align-items: stretch; gap: 3px; padding: 0 20px 0 30px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
    .market-nav::-webkit-scrollbar { display: none; }
    .market-tab { background: none; color: white; border: 0; padding: 0 14px; font-size: 12px; font-weight: 700; }
    .market-tab:first-child { padding-left: 11px; padding-right: 11px; }
    .market-tab.active { align-self: center; padding-top: 6px; padding-bottom: 6px; border-radius: 20px; background: white; color: #111; }
    .market-tab:not(.active):hover { color: var(--green); }
    .alerts { margin-left: auto; display: grid; place-items: center; background: transparent; border: none; color: #bbb; min-width: 25px; }
    .alerts svg { height: 18px; width: 18px; }
    .markets { padding: 29px 39px 70px 30px; }
    .market-card { background: var(--card); margin-bottom: 8px; border-radius: 6px; overflow: hidden; }
    .market-head { min-height: 56px; display: flex; align-items: center; padding: 0 10px 0 10px; }
    .market-head.tall { min-height: 58px; }
    .market-title { display: flex; flex: 1; flex-direction: column; justify-content: center; align-items: flex-start; border: none; background: transparent; color: white; text-align: left; padding: 7px 0; min-height: 54px; font-size: 16px; font-weight: 700; }
    .market-subtitle { font-size: 11px; color: var(--green); font-weight: 700; margin-top: 3px; }
    .boost { background: #00f2b2; border-radius: 2px; color: #052719; display: inline-block; padding: 2px 4px 1px; margin: 0 20px 0 6px; font-size: 10px; line-height: 1.05; font-style: italic; font-weight: 900; letter-spacing: -.3px; }
    .chevron { display: grid; place-items: center; width: 20px; height: 35px; border: 0; background: transparent; color: #d3d3d3; }
    .chevron svg { width: 16px; height: 16px; transition: transform .2s; }
    .market-card.closed .chevron svg { transform: rotate(-90deg); }
    .market-card.closed .market-content { display: none; }
    .odds-grid { border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .odd { min-height: 45px; display: flex; align-items: center; justify-content: center; gap: 5px; background: transparent; color: white; border: 0; border-right: 1px solid transparent; font-size: 12px; }
    .odd:hover { background: #333; }
    .odd.chosen { background: #334e3f; box-shadow: inset 0 0 0 1px var(--green); }
    .odd .price { color: var(--gold); font-weight: 700; }
    .two-col { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .line-header { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); background: #303030; color: white; min-height: 29px; font-size: 12px; align-items: center; text-align: center; font-weight: 700; }
    .line-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); min-height: 43px; align-items: stretch; }
    .line-row + .line-row { border-top: 1px solid #383838; }
    .line-label { display: grid; place-items: center; font-size: 12px; }
    .line-row .odd:not(:last-child) { border-left: 1px solid #383838; }
    .footer-note { color: #9a9a9a; font-size: 11px; margin-top: 18px; }
    .search-flyout { position: absolute; top: 61px; right: 177px; width: min(340px, calc(100vw - 24px)); background: #222; border: 1px solid #386e5e; border-radius: 8px; padding: 12px; box-shadow: 0 12px 28px #0009; display: none; }
    .search-flyout.open { display: block; }
    .search-flyout label { display: block; font-size: 12px; margin-bottom: 8px; color: #ddd; }
    .search-flyout input { width: 100%; border: 1px solid #757575; border-radius: 4px; padding: 10px 11px; color: white; background: #111; }
    .search-result { padding: 11px 5px 0; color: var(--green); font-size: 12px; }
    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(24px); background: #293f36; color: #fff; padding: 10px 18px; border: 1px solid #16816a; border-radius: 8px; z-index: 45; box-shadow: 0 12px 32px #0007; opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100vw - 30px); text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .betslip { position: fixed; right: 18px; bottom: 18px; width: 290px; max-width: calc(100vw - 36px); border: 1px solid #23755a; background: #1c261f; border-radius: 9px; z-index: 35; box-shadow: 0 12px 32px #000a; padding: 14px; display: none; }
    .betslip.show { display: block; }
    .betslip-title { display: flex; align-items: center; justify-content: space-between; font-weight: 700; color: var(--green); }
    .betslip-title button { border: 0; background: none; color: white; font-size: 22px; }
    .betslip p { font-size: 12px; line-height: 1.6; margin-bottom: 0; }
    .betslip small { color: #bbb; }
    .betslip .selected-odd { color: var(--gold); }
    .mobile-menu { display: none; border: 0; color: white; background: transparent; padding: 5px 9px; }
    .mobile-menu svg { width: 23px; }
    @media (max-width: 1150px) {
      :root { --sidebar-width: 235px; }
      .top-links { margin-left: 7vw; gap: 34px; }
      .header-actions { gap: 6px; }
      .pill { padding-left: 10px; padding-right: 10px; }
    }
    @media (max-width: 850px) {
      :root { --sidebar-width: 220px; }
      .top-links { margin-left: 22px; gap: 22px; }
      .header-actions .pill:first-of-type { display: none; }
      .market-nav { padding-left: 12px; }
      .markets { padding-left: 15px; padding-right: 16px; }
    }
    @media (max-width: 690px) {
      .mobile-menu { display: block; }
      .brand { width: auto; min-width: 0; font-size: 25px; padding-left: 0; margin-right: 15px; }
      .site-header { padding-right: 8px; }
      .top-links { margin-left: auto; gap: 14px; }
      .top-link { font-size: 12px; }
      .top-link:last-child { display: none; }
      .header-actions { margin-left: auto; }
      .pill { display: none; }
      aside { position: fixed; top: var(--header-height); left: 0; bottom: 0; z-index: 25; transform: translateX(-100%); transition: transform .2s; box-shadow: 8px 0 18px #0009; }
      aside.open { transform: translateX(0); }
      .event-hero { height: 154px; }
      .team.home { left: calc(25% - 50px); }
      .team.away { right: calc(25% - 50px); }
      .league { top: 18px; }
      .kickoff { top: 67px; }
      .versus { top: 94px; }
      .team { top: 57px; }
      .market-head { padding-left: 13px; }
      .market-title { font-size: 14px; }
      .odd { font-size: 11px; }
      .search-flyout { right: 8px; }
    }
    @media (max-width: 380px) { .top-link:nth-child(2) { display: none; } }
  </style>
</head>
<body>
<div class="app">
  <header class="site-header">
    <button class="mobile-menu" id="mobileMenu" aria-label="Toggle sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand" aria-label="bet365"><span>bet</span><span class="digits">365</span></div>
    <nav class="top-links" aria-label="Primary navigation">
      <button class="top-link active" data-top="All Sports">All Sports</button>
      <button class="top-link" data-top="In-Play">In-Play</button>
      <button class="top-link" data-top="Casino">Casino</button>
    </nav>
    <div class="header-actions">
      <button class="icon-button" id="searchToggle" aria-label="Search" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="10.7" cy="10.7" r="7.2"/><path d="m16.1 16.1 5 5"/></svg></button>
      <button class="pill" data-demo="Rewards">Rewards</button>
      <button class="pill yellow" data-demo="Join">Join</button>
      <button class="pill" data-demo="Log In">Log In</button>
    </div>
    <div class="search-flyout" id="searchPanel">
      <label for="searchField">Search sporting events</label>
      <input id="searchField" type="search" placeholder="Search teams or competitions" />
      <div class="search-result" id="searchResult">York v Walsall — England League 2</div>
    </div>
  </header>
  <div class="site-body">
    <aside id="sidebar" aria-label="Sports navigation">
      <section class="side-group">
        <h2 class="side-heading">Trending</h2>
        <button class="side-item" data-sport="UEFA Nations League A"><span class="sport-emoji">⚽</span>UEFA Nations League A</button>
        <button class="side-item" data-sport="UEFA Nations League B"><span class="sport-emoji">⚽</span>UEFA Nations League B</button>
        <button class="side-item" data-sport="UEFA Nations League C"><span class="sport-emoji">⚽</span>UEFA Nations League C</button>
        <button class="side-item" data-sport="Next Races"><span class="sport-emoji">🐎</span>Next Races</button>
        <button class="side-item" data-sport="Upcoming Tennis"><span class="sport-emoji">🎾</span>Upcoming Tennis</button>
        <button class="side-item" data-sport="NBA"><span class="sport-emoji">🏀</span>NBA</button>
        <button class="side-item" data-sport="Upcoming Football"><span class="sport-emoji">⚽</span>Upcoming Football</button>
      </section>
      <section class="side-group">
        <h2 class="side-heading">Most Used</h2>
        <button class="side-item" data-sport="NBA"><span class="sport-emoji">🇺🇸</span>NBA</button>
        <button class="side-item" data-sport="Basketball"><span class="sport-emoji">🏀</span>Basketball</button>
        <button class="side-item" data-sport="NCAAF"><span class="sport-emoji">🇺🇸</span>NCAAF</button>
      </section>
      <section class="side-group">
        <h2 class="side-heading">All Sports</h2>
        <button class="side-item" data-sport="Football"><span class="sport-emoji">⚽</span>Football</button>
        <button class="side-item" data-sport="Tennis"><span class="sport-emoji">🎾</span>Tennis</button>
        <button class="side-item" data-sport="Basketball"><span class="sport-emoji">🏀</span>Basketball</button>
        <button class="side-item" data-sport="Horse Racing"><span class="sport-emoji">🐎</span>Horse Racing</button>
      </section>
    </aside>
    <main id="content">
      <section class="event-hero" aria-label="York versus Walsall match information">
        <button class="back-button" id="backButton" title="Back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m7-7-7 7 7 7"/></svg>
        </button>
        <div class="league">England League 2</div>
        <div class="team home">
          <svg class="shirt" viewBox="0 0 40 42" role="img" aria-label="Red football jersey">
            <path d="M13 4 18 2h4l5 2 9 4-2 10-6-2v22H12V16l-6 2L4 8l9-4Z" fill="#f52d4c"/>
            <path d="M12 5 16 3 20 8 24 3l4 2-5 8h-6Z" fill="#dc1738"/><path d="m8 7 3 8-4 1-2-7ZM32 7l-3 8 4 1 2-7Z" fill="#e81d43"/>
            <path d="M18 2h4l2 2-4 3-4-3Z" fill="#f8c7cd"/>
            <path d="M15 18v15M25 18v15" stroke="#a81934" opacity=".4" stroke-width=".8"/>
          </svg>
          <span>York</span>
        </div>
        <div class="kickoff">21 Nov 16:00</div>
        <div class="versus">v</div>
        <div class="team away">
          <svg class="shirt" viewBox="0 0 40 42" role="img" aria-label="White football jersey">
            <path d="M13 4 18 2h4l5 2 9 4-2 10-6-2v22H12V16l-6 2L4 8l9-4Z" fill="#f7f8f6"/>
            <path d="M12 5 16 3 20 8 24 3l4 2-5 8h-6Z" fill="#e7ebe9"/><path d="m8 7 3 8-4 1-2-7ZM32 7l-3 8 4 1 2-7Z" fill="#d2ded8"/>
            <path d="M18 2h4l2 2-4 3-4-3Z" fill="#1c754e"/><circle cx="26" cy="13" r="3" fill="#ef3556"/><circle cx="26" cy="13" r="1" fill="#0e4d3a"/>
          </svg>
          <span>Walsall</span>
        </div>
        <button class="match-menu" id="matchMenu" title="Match options" aria-label="Match options">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </section>
      <nav class="market-nav" aria-label="Betting markets" id="marketNav">
        <button class="market-tab active" data-tab="Popular">Popular</button>
        <button class="market-tab" data-tab="Bet Builder">Bet Builder</button>
        <button class="market-tab" data-tab="Quick Players">Quick Players</button>
        <button class="market-tab" data-tab="Scorers">Scorers</button>
        <button class="market-tab" data-tab="Result">Result</button>
        <button class="market-tab" data-tab="Corners">Corners</button>
        <button class="market-tab" data-tab="Goals">Goals</button>
        <button class="market-tab" data-tab="Half">Half</button>
        <button class="market-tab" data-tab="Other">Other</button>
        <button class="market-tab" data-tab="Asian Lines">Asian Lines</button>
        <button class="alerts" id="alerts" aria-label="Notification settings"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button>
      </nav>
      <section class="markets" id="markets" aria-label="Match markets"></section>
    </main>
  </div>
</div>
<div class="betslip" id="betSlip" role="status" aria-live="polite">
  <div class="betslip-title"><span>Selection preview</span><button type="button" id="closeSlip" aria-label="Close selection preview">×</button></div>
  <p id="selectionText"></p><small>Visual demonstration only. No bets, deposits, or account functions are available.</small>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  // A standalone interface demonstration. This page does not connect to bet365 or process wagers.
  const marketsEl = document.getElementById('markets');
  const escapeHtml = (str) => String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const o = (label, price) => `<button type="button" class="odd" data-label="${escapeHtml(label)}" data-price="${escapeHtml(price)}"><span>${escapeHtml(label)}</span><span class="price">${escapeHtml(price)}</span></button>`;
  function optionsGrid(items, columns = 3) {
    return `<div class="odds-grid ${columns === 2 ? 'two-col' : ''}">${items.map(([name,price])=>o(name,price)).join('')}</div>`;
  }
  function linesGrid(rows, headings = ['','Over','Under']) {
    return `<div class="line-header">${headings.map(x => `<div>${escapeHtml(x)}</div>`).join('')}</div>` +
      rows.map(([line, over, under]) => `<div class="line-row"><div class="line-label">${escapeHtml(line)}</div>${o('',over)}${o('',under)}</div>`).join('');
  }
  const data = {
    'Popular': [
      {title:'Full Time Result', sub:'ACCA BOOST', open:true, html:optionsGrid([['York','1.76'],['Draw','3.75'],['Walsall','3.75']])},
      {title:'Goalscorers', sub:'SUB ON PLAY ON', open:false, html:optionsGrid([['Anytime goalscorer','2.70'],['First goalscorer','4.50'],['Last goalscorer','4.50']])},
      {title:'Double Chance', open:false, html:optionsGrid([['York or Draw','1.25'],['York or Walsall','1.28'],['Draw or Walsall','1.95']])},
      {title:'Goals Over/Under', open:true, html:linesGrid([['2.5','1.53','2.40'],['1.5','1.18','4.33'],['3.5','2.37','1.50'],['4.5','4.33','1.18']])},
      {title:'Both Teams to Score', open:false, html:optionsGrid([['Yes','1.70'],['No','2.05']],2)},
      {title:'Correct Score', open:false, html:optionsGrid([['1–0','7.50'],['1–1','6.50'],['2–1','8.50']])},
      {title:'Half Time Result', open:false, html:optionsGrid([['York','2.20'],['Draw','2.15'],['Walsall','4.00']])}
    ],
    'Bet Builder': [
      {title:'Full Time Result', open:true, html:optionsGrid([['York','1.76'],['Draw','3.75'],['Walsall','3.75']])},
      {title:'Goals Over/Under',open:true,html:linesGrid([['1.5','1.18','4.33'],['2.5','1.53','2.40']])},
      {title:'Both Teams to Score', open:false, html:optionsGrid([['Yes','1.70'],['No','2.05']],2)}
    ],
    'Quick Players': [{title:'Player to Score',open:true,html:optionsGrid([['York Player','2.80'],['Walsall Player','3.50']],2)}],
    'Scorers': [{title:'Goalscorers',sub:'SUB ON PLAY ON',open:true,html:optionsGrid([['Anytime','2.70'],['First','4.50'],['Last','4.50']])}],
    'Result': [{title:'Full Time Result',sub:'ACCA BOOST',open:true,html:optionsGrid([['York','1.76'],['Draw','3.75'],['Walsall','3.75']])}, {title:'Double Chance',open:true,html:optionsGrid([['York or Draw','1.25'],['York or Walsall','1.28'],['Draw or Walsall','1.95']])}],
    'Corners': [{title:'Total Corners Over/Under',open:true,html:linesGrid([['8.5','1.85','1.85'],['9.5','2.00','1.75'],['10.5','2.25','1.57']])}],
    'Goals': [{title:'Goals Over/Under',open:true,html:linesGrid([['1.5','1.18','4.33'],['2.5','1.53','2.40'],['3.5','2.37','1.50']])}, {title:'Both Teams to Score',open:true,html:optionsGrid([['Yes','1.70'],['No','2.05']],2)}],
    'Half': [{title:'Half Time Result',open:true,html:optionsGrid([['York','2.20'],['Draw','2.15'],['Walsall','4.00']])}, {title:'First Half Goals Over/Under',open:false,html:linesGrid([['0.5','1.30','3.30'],['1.5','2.70','1.40']])}],
    'Other': [{title:'Correct Score',open:true,html:optionsGrid([['1–0','7.50'],['1–1','6.50'],['2–1','8.50']])}],
    'Asian Lines': [{title:'Asian Handicap',open:true,html:linesGrid([['York -0.5','1.77','2.05'],['York -1','2.35','1.55']],['','York','Walsall'])}]
  };
  function renderMarkets(tab) {
    marketsEl.innerHTML = data[tab].map((m,i) => `
      <article class="market-card ${m.open ? '' : 'closed'}">
        <div class="market-head ${m.sub ? 'tall' : ''}">
          <button type="button" class="market-title" aria-expanded="${m.open}" aria-controls="market-panel-${i}">
            <span>${escapeHtml(m.title)}</span>${m.sub ? `<span class="market-subtitle">${escapeHtml(m.sub)}</span>`:''}
          </button>
          <span class="boost" aria-label="Bet Builder">BB</span>
          <button type="button" class="chevron" aria-label="Toggle ${escapeHtml(m.title)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 9 7 7 7-7"/></svg></button>
        </div><div class="market-content" id="market-panel-${i}">${m.html}</div>
      </article>`).join('') + '<p class="footer-note">Odds are example values copied from the supplied screenshot where visible. This is a non-functional betting interface demo.</p>';
  }
  renderMarkets('Popular');
  marketsEl.addEventListener('click', e => {
    const toggle = e.target.closest('.market-title, .chevron');
    if (toggle) {
      const card = toggle.closest('.market-card');
      card.classList.toggle('closed');
      card.querySelector('.market-title').setAttribute('aria-expanded', String(!card.classList.contains('closed')));
      return;
    }
    const choice = e.target.closest('.odd');
    if (!choice) return;
    marketsEl.querySelectorAll('.odd.chosen').forEach(el => el.classList.remove('chosen'));
    choice.classList.add('chosen');
    const market = choice.closest('.market-card').querySelector('.market-title span').textContent;
    const label = choice.dataset.label || choice.parentElement.querySelector('.line-label')?.textContent || 'Selection';
    document.getElementById('selectionText').innerHTML = `${escapeHtml('York v Walsall')}<br>${escapeHtml(market)}: ${escapeHtml(label)} <strong class="selected-odd">${escapeHtml(choice.dataset.price)}</strong>`;
    document.getElementById('betSlip').classList.add('show');
  });
  document.getElementById('closeSlip').addEventListener('click', () => {
    document.getElementById('betSlip').classList.remove('show');
    marketsEl.querySelectorAll('.chosen').forEach(el => el.classList.remove('chosen'));
  });
  document.getElementById('marketNav').addEventListener('click', e => {
    const button = e.target.closest('.market-tab');
    if (!button) return;
    document.querySelectorAll('.market-tab').forEach(b => b.classList.toggle('active', b === button));
    document.getElementById('betSlip').classList.remove('show');
    renderMarkets(button.dataset.tab);
  });
  let toastTimer;
  function toast(message) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }
  document.querySelectorAll('[data-demo]').forEach(b => b.addEventListener('click', () => toast(`${b.dataset.demo} is disabled in this visual-only demo.`)));
  document.querySelectorAll('[data-top]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-top]').forEach(x=>x.classList.toggle('active',x===b));
    if (b.dataset.top !== 'All Sports') toast(`${b.dataset.top} is a demonstration navigation item.`);
  }));
  document.querySelectorAll('[data-sport]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-sport]').forEach(x=>x.classList.toggle('selected',x===b));
    toast(`${b.dataset.sport} selected — event listings are not connected in this demo.`);
    if (innerWidth <= 690) closeSidebar();
  }));
  document.getElementById('searchToggle').addEventListener('click', () => {
    const panel = document.getElementById('searchPanel');
    const isOpen = panel.classList.toggle('open');
    document.getElementById('searchToggle').setAttribute('aria-expanded', String(isOpen));
    if(isOpen) document.getElementById('searchField').focus();
  });
  document.getElementById('searchField').addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    document.getElementById('searchResult').textContent = !q || ['york','walsall','league','england'].some(t=>t.includes(q)) ? 'York v Walsall — England League 2' : 'No matching events in this demo';
  });
  function closeSidebar() {document.getElementById('sidebar').classList.remove('open'); document.getElementById('mobileMenu').setAttribute('aria-expanded','false');}
  document.getElementById('mobileMenu').addEventListener('click', () => {
    const isOpen = document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('mobileMenu').setAttribute('aria-expanded',String(isOpen));
  });
  document.getElementById('alerts').addEventListener('click', () => toast('Match alerts are unavailable in the demo.'));
  document.getElementById('backButton').addEventListener('click', () => toast('This is the only match page in the demo.'));
  document.getElementById('matchMenu').addEventListener('click', () => toast('York v Walsall • England League 2 • 21 Nov 16:00'));
  document.addEventListener('keydown', e => {if(e.key==='Escape'){document.getElementById('searchPanel').classList.remove('open');closeSidebar();document.getElementById('betSlip').classList.remove('show');}});
</script>
</body>
</html>
